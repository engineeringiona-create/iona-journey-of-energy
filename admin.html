<!DOCTYPE html><html class="scroll-smooth" lang="tr"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<meta name="robots" content="noindex, nofollow">
<script>(function(){try{var t=localStorage.getItem('iona-theme');if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.classList.add('dark');}}catch(e){}})();</script>
<title>IONA - Admin</title>
<link rel="icon" type="image/svg+xml" href="/images/iona-icon.svg">
<!-- Fontlar. 2026-09-19'a kadar burada 4 ayrı render-bloklayan istek vardı ve
     Material Symbols'ün TAMAMI (binlerce ikon, 6,7 MB) her sayfada indiriliyordu.
     Şimdi 2 istek: ikon fontu `icon_names` ile sitede gerçekten kullanılan 50
     ikona indirgendi (6,7 MB -> 17 KB), metin fontları tek çağrıda birleşti.
     preconnect'ler, font dosyalarının geldiği ikinci origin olan gstatic'in
     DNS+TLS el sıkışmasını CSS beklemeden başlatıyor.

     DİKKAT: yeni bir Material Symbols ikonu eklersen adını aşağıdaki
     icon_names listesine DE ekle — listede olmayan ikon, fontta ligatür
     bulunamadığı için ikon yerine düz yazı olarak görünür ("arrow_forward"
     kelimesi ekrana basılır). Liste 8 sayfada da aynıdır. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;icon_names=ac_unit,arrow_forward,autorenew,bar_chart,battery_full,bolt,build,call,campaign,check,checklist,close,conveyor_belt,dark_mode,dashboard_customize,description,device_thermostat,filter_alt,format_align_center,format_align_left,format_align_right,groups,history,keyboard_arrow_down,language,layers,light_mode,local_shipping,location_on,mail,menu,newspaper,palette,payments,perm_media,plumbing,precision_manufacturing,propane_tank,qr_code_scanner,report,science,search,sensors,shield,star,summarize,travel_explore,view_in_ar,warning,water_drop&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Montserrat:wght@400;500;600;700;800&amp;family=Quicksand:wght@600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/styles/tailwind.css">
<link rel="stylesheet" href="/src/styles/base.css">
</head>

</body></html>
